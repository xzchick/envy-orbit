[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "envy-orbit"
version = "0.1.0"
description = "ENVY Orbit: encrypted recurring-cadence tracking — keep everything in orbit, in a native app window"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "cryptography>=42,<47",
  "PyQt6>=6.7,<7",
]

[project.scripts]
envy-orbit = "envy_orbit.cli:main"

[project.gui-scripts]
envy-orbit-gui = "envy_orbit.cli:main"

[tool.setuptools.packages.find]
include = ["envy_orbit*"]
